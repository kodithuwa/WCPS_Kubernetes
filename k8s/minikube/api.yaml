apiVersion: v1
kind: Service
metadata:
  name: wcps-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: wcps-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wcps-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wcps-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wcps-api
    spec:
      containers:
        - name: api
          image: wcps-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: wcps-config
          env:
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wcps-secrets
                  key: MSSQL_SA_PASSWORD
            - name: ConnectionStrings__DefaultConnection
              value: >-
                Server=sqlserver,1433;Database=WCPS;User Id=sa;Password=$(MSSQL_SA_PASSWORD);Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True
          startupProbe:
            httpGet:
              path: /WeatherForecast
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /WeatherForecast
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /WeatherForecast
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 768Mi
